name: danpan-omok
services:
  server:
    container_name: danpan-omok-server
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: server
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      DATABASE_PATH: /data/omok.sqlite
      ALLOWED_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN to your actual DNS name}
    volumes:
      - omok_data:/data
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: none
  proxy:
    container_name: danpan-omok-proxy
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: proxy
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to your actual DNS name}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: none
volumes:
  omok_data:
  caddy_data:
  caddy_config:
